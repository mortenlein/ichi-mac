name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Lint
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Catches breakage in the bundling itself — a bad Info.plist or a
      # codesign failure would otherwise only surface at release time.
      - name: Smoke Test Bundle
        run: |
          ./bundle.sh
          test -x target/Ichi.app/Contents/MacOS/ichi
          codesign --verify --verbose=2 target/Ichi.app
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" target/Ichi.app/Contents/Info.plist
